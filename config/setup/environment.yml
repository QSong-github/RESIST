# =============================================================================
# RESIST | conda environment for the R analysis modules
#   conda env create -f config/setup/environment.yml && conda activate resist
#   Rscript config/setup/install_r_packages.R      # install remaining R dependencies and check software
# =============================================================================
name: resist
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - git
  - make
  - pkg-config
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - r-base=4.5
  - r-tidyverse
  - r-seurat
  - r-matrix
  - r-yaml
  - r-jsonlite
  - r-devtools
  - r-remotes
  - r-biocmanager
  - r-igraph
  - r-nmf
  - r-circlize
  - r-ggalluvial
  - r-svglite
  - r-rcpp
  - r-rcppeigen
  - r-rspectra
  - r-reticulate
  - bioconductor-biocneighbors
  - bioconductor-biocgenerics
  - bioconductor-complexheatmap
  - r-rcolorbrewer
  - r-ggsci
  - r-ggrepel
  - r-cowplot
  - r-patchwork
  - r-pheatmap
  - r-viridis
  - r-reshape2
  - r-scales
  - r-broom
  - r-treemap
  - r-treemapify
  - r-packcircles
  - r-r.utils
  - bioconductor-singlecellexperiment
  - bioconductor-genomicranges
  - bioconductor-rtracklayer
  - bioconductor-clusterprofiler
  - bioconductor-gsva
  - bioconductor-gseabase
  - bioconductor-fgsea
  - bioconductor-biomart
  - bioconductor-org.hs.eg.db
  - bioconductor-org.mm.eg.db
  - bioconductor-cmapr
  - r-msigdbr
